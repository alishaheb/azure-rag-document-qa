name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # needed for passwordless login to Azure (OIDC)

env:
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  APP_NAME: askdocs-app
  IMAGE_NAME: ask-my-docs

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure (OIDC, no secrets stored)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Find the image that runs now
        id: current
        run: |
          CURRENT=$(az containerapp show -g "$RESOURCE_GROUP" -n "$APP_NAME" \
            --query "properties.template.containers[0].image" -o tsv 2>/dev/null || true)
          # The sample image is only a placeholder for the first deployment.
          if [[ "$CURRENT" == mcr.microsoft.com/* ]]; then CURRENT=""; fi
          echo "image=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Deploy infrastructure (Bicep)
        id: infra
        run: |
          az deployment group create -g "$RESOURCE_GROUP" -n main \
            -f infra/main.bicep \
            -p containerImage="${{ steps.current.outputs.image }}" \
               alertEmail="${{ vars.ALERT_EMAIL }}" \
               searchSku="${{ vars.SEARCH_SKU || 'basic' }}" \
            --query properties.outputs -o json > outputs.json
          echo "registry=$(jq -r .registryName.value outputs.json)" >> "$GITHUB_OUTPUT"
          echo "server=$(jq -r .registryLoginServer.value outputs.json)" >> "$GITHUB_OUTPUT"

      - name: Build and push the container image
        run: |
          IMAGE="${{ steps.infra.outputs.server }}/$IMAGE_NAME:${{ github.sha }}"
          az acr login -n "${{ steps.infra.outputs.registry }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy the new image (Bicep again, same template)
        id: app
        run: |
          az deployment group create -g "$RESOURCE_GROUP" -n main \
            -f infra/main.bicep \
            -p containerImage="${{ steps.infra.outputs.server }}/$IMAGE_NAME:${{ github.sha }}" \
               alertEmail="${{ vars.ALERT_EMAIL }}" \
               searchSku="${{ vars.SEARCH_SKU || 'basic' }}" \
            --query properties.outputs.appUrl.value -o tsv > url.txt
          echo "url=$(cat url.txt)" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "${{ steps.app.outputs.url }}/health"; then
              echo; echo "App is live: ${{ steps.app.outputs.url }}"; exit 0
            fi
            sleep 15
          done
          echo "Health check failed"; exit 1
